# Deploy to GitHub Pages via GitHub Actions.
#
# STATUS: manual-only (workflow_dispatch). The current deploy uses a manual
# push to the `gh-pages` branch (see git log of origin/gh-pages). When the
# project is ready to switch to automated deploys via GitHub Actions:
#   1. Update next.config to use `output: "export"` (currently "standalone")
#   2. Change the trigger below to: `on: push: branches: [main]`
#   3. Ensure repo setting: Settings → Pages → Source = GitHub Actions
#
# This workflow is intentionally non-triggering on push to avoid breaking
# the existing gh-pages branch deploy.

name: Deploy to GitHub Pages (manual)

on:
  workflow_dispatch:

concurrency:
  group: pages-deploy
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build static export
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Cache Bun
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # NOTE: this requires `output: "export"` in next.config.ts.
      # Currently the project uses `output: "standalone"` so this workflow
      # will fail until the config is updated. That's intentional — this
      # workflow is documentation for the future deploy path.
      - name: Build static export
        run: bun run build
        env:
          CI: true
          NEXT_TELEMETRY_DISABLED: 1

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
